# Fly.io app: one always-on machine serving the landing page, app and API.
# If the name "chipi-ai" is taken, change it here (and in CORS_ORIGINS).
app = "chipi-ai"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  MOCK_MODE = "1"
  CORS_ORIGINS = "https://chipi-ai.fly.dev"
  DATA_DIR = "/data"
  # The OpenAI project uses US data residency: calls must go to the US host.
  OPENAI_BASE_URL = "https://us.api.openai.com/v1"
  # OpenAI models (checked against this key's /v1/models on 2026-11-15)
  OPENAI_MODEL_SMART = "gpt-6-astra"
  OPENAI_MODEL_CHECK = "gpt-6.1-sol"
  OPENAI_MODEL_FAST = "gpt-6-luna"

# Data volume (created 2026-11-15: vol_vz867073oq9wq9qv, 1 GB, iad, encrypted).
# One machine only: a volume attaches to a single machine. Recreate with:
#   fly volumes create chipi_data --region iad --size 1 -a chipi-ai
[mounts]
  source = "chipi_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Never sleep: the laptop routine and judges must not hit a cold start.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512  # written by Fly Launch; same as memory above
