# fly.toml app configuration file generated for chipi-ai on 2026-11-15T21:35:13Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'chipi-ai'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  CORS_ORIGINS = 'https://chipi-ai.fly.dev'
  MOCK_MODE = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
