name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the GITHUB_TOKEN in every job.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install and test
        run: cd backend && uv sync --frozen && uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        run: cd frontend && npm ci && npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: docker build -t chipi-ai:ci .

  # Ships main to Fly once every check above has passed. Needs the repo secret
  # FLY_API_TOKEN (Fly dashboard → Tokens → deploy token for chipi-ai). Without it,
  # this job skips with a notice instead of failing CI.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, docker]
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    # The token is passed only to the two steps that need it, never job-wide.
    steps:
      - uses: actions/checkout@v4
      - name: Check for the Fly token
        id: token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::FLY_API_TOKEN is not set, so this push was not deployed."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      # Pinned to a commit SHA (release 1.6) so a moved tag can't change what runs.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        if: steps.token.outputs.present == 'true'
      - name: Deploy to Fly
        if: steps.token.outputs.present == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --app chipi-ai
      - name: Check the live site
        if: steps.token.outputs.present == 'true'
        run: |
          for i in $(seq 1 20); do
            if curl -sf https://chipi-ai.fly.dev/health; then echo; exit 0; fi
            sleep 6
          done
          echo "::error::chipi-ai.fly.dev/health did not respond after the deploy"; exit 1
